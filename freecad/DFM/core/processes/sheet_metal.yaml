name: Sheet Metal Fabrication
category: Sheet Metal
description: 'Parts cut from flat stock and folded on a press brake. Nothing is cut from solid,
  so the machining rules do not apply: what matters instead is what the die and the brake
  can do -- a minimum bend radius, a flange long enough to grip, a hole big enough to punch
  without breaking the tool, and a draw depth the material will stretch to.'
