name: CNC Turning
category: CNC Machining
description: 'Subtractive machining on a lathe: the part rotates and the tool traverses, so
  the geometry is a body of revolution. The part is gripped by its outside diameter in a chuck,
  which is why the vise workholding rules do not apply here.

  '
