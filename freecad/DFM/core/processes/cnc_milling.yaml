name: CNC Milling
category: CNC Machining
description: 'Subtractive machining on a milling centre: the part is cut from solid stock
  held in a vise or fixture, with the cutter approaching from a limited number of directions.
  Rules cover workholding, proportion, wall thickness and stock waste.

  '
